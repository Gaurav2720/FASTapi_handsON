name: FastAPI Docker CI/CD

# Trigger whenever code is pushed to main
on:
  push:
    branches:
      - main

  # Allow manual execution
  workflow_dispatch:

jobs:
  build-and-push:

    # GitHub provides a temporary Ubuntu runner
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 4: Build Docker image and push it
      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: gerrordev/fastapi-health:latest